[package]
name = "nxm-tui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Terminal client for NXM — connects to any OpenAI-compatible LLM server"
repository = "https://github.com/nxm-ai/nxm-tui"

[[bin]]
name = "nxm-tui"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
futures = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Utilities
dirs = "6"
shellexpand = "3"
toml = "1"
chrono = "0.4"

# Pure-Rust tool actuators (web_search, read_file, list_resources).
# Path dep for the P2-proprio spike; pin a cargo-release or git version later.
nxm-tools = { path = "../nxm-tools" }
