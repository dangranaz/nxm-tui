[workspace]
resolver = "2"
members = ["nxm-tui-tools"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dangranaz/nxm-tui"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[package]
name = "nxm-tui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Terminal client for NXM — connects to any OpenAI-compatible LLM server"
repository = "https://github.com/dangranaz/nxm-tui"

[[bin]]
name = "nxm-tui"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
futures = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Utilities
dirs = "6"
shellexpand = "3"
toml = "1"
chrono = "0.4"

# Keychain access (Rust 1.88+)
keyring = "4.2.0"

# Pure-Rust tool actuators (web_search, read_file, list_resources).
# Now a workspace member (moved here from nxm-mcp-servers). Kept importable as
# `nxm_tools` via package rename so existing `use nxm_tools::...` keeps working.
nxm-tui-tools = { path = "nxm-tui-tools" }

[dev-dependencies]
keyring-core = "1.0"
